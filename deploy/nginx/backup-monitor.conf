# BackupMonitor 反向代理配置
#
# 形态：nginx 终结 TLS 与 mTLS，反向代理到本机回环上的 Kestrel（127.0.0.1:5080）。
#
# 前置约束（缺一不可）：
#   1. Kestrel 必须只监听 127.0.0.1。若监听 0.0.0.0，攻击者可绕过 nginx
#      直连明文端口，同时跳过 TLS 与客户端证书校验。
#   2. 应用侧 Security:ClientAuth:ForwardedProxies 必须包含本机回环地址，
#      否则 X-Client-* 头一律不采信。
#   3. ssl_client_certificate 必须与应用签发客户端证书所用的 CA 一致
#      （即 Security:ClientCa:CertPath 对应的那张 CA）。

upstream backup_monitor {
    server 127.0.0.1:5080;
    keepalive 32;
}

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    server_name backup.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name backup.example.internal;

    # ---- 服务端证书 ----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 设计书 23 要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 客户端证书（mTLS）----
    # optional 而非 on：Agent 注册接口在拿到证书之前必须能匿名访问，
    # 由应用按接口决定是否要求证书。校验结果通过 $ssl_client_verify 透传。
    ssl_client_certificate /etc/nginx/certs/client-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # 上传分块上限 32MB，留出余量
    client_max_body_size 64m;

    # 静态资源与 JSON 响应压缩（实施方案 W1）。
    # 应用侧也开了 ResponseCompression——Turnkey 形态是 Kestrel 直接对外、没有这一层代理，
    # 两处都要有。这里的 gzip 对已经被上游压过的响应不会重复压。
    # 注意 application/octet-stream 与 application/zip 刻意不在名单里：那是恢复下载的备份文件。
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://backup_monitor;
        proxy_http_version 1.1;

        # 必须显式清空，否则上面 upstream 里的 keepalive 32 形同虚设：
        # nginx 默认把客户端的 Connection 头透传给上游，客户端不带时则发 Connection: close，
        # 于是**每一个分块 PUT 都新建一条到 Kestrel 的 TCP 连接**。回环握手本身很便宜，
        # 所以这不是吞吐问题而是连接数问题——每条连接结束后进入 TIME_WAIT，
        # 高并发上传下累积到临时端口耗尽，表现为「传着传着开始随机报连接失败」。
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 客户端证书校验结果透传。
        # proxy_set_header 会覆盖客户端自带的同名头，因此外部无法伪造；
        # 应用侧还会二次校验「请求是否来自可信代理」。
        proxy_set_header X-Client-Verify      $ssl_client_verify;
        proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;

        # 分块上传与恢复下载都是大流量长连接：关闭缓冲，放宽超时
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # 恢复下载：URL 路径段就是一次性下载令牌（/api/v1/downloads/{token}）。
    # 审查 P2-3：默认 access_log 会把它原文落盘，有日志读取权限的人可在 TTL 内重放，
    # 直接取走整个备份集。这里关闭该路径的访问日志——下载行为本身由应用侧
    # restore.download 审计记录，不依赖 nginx 日志，关掉不丢可追溯性。
    location /api/v1/downloads/ {
        proxy_pass         http://backup_monitor;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";   # 同上，让 upstream keepalive 真正生效

        # 备份文件要么本就压不动、要么已经压过，压第二遍只是在传几十 GB 时白烧一个核。
        gzip off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        access_log off;
    }

    # 健康检查不需要经过上面的大流量设置
    location = /health {
        proxy_pass       http://backup_monitor;
        proxy_set_header Host $host;
        access_log       off;
    }
}
