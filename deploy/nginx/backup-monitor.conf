# BackupMonitor 反向代理配置
#
# 形态：nginx 终结 TLS 与 mTLS，反向代理到本机回环上的 Kestrel（127.0.0.1:5080）。
#
# 前置约束（缺一不可）：
#   1. Kestrel 必须只监听 127.0.0.1。若监听 0.0.0.0，攻击者可绕过 nginx
#      直连明文端口，同时跳过 TLS 与客户端证书校验。
#   2. 应用侧 Security:ClientAuth:ForwardedProxies 必须包含本机回环地址，
#      否则 X-Client-* 头一律不采信。
#   3. ssl_client_certificate 必须与应用签发客户端证书所用的 CA 一致
#      （即 Security:ClientCa:CertPath 对应的那张 CA）。

upstream backup_monitor {
    server 127.0.0.1:5080;
    keepalive 32;
}

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    server_name backup.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name backup.example.internal;

    # ---- 服务端证书 ----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 设计书 23 要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 客户端证书（mTLS）----
    # optional 而非 on：Agent 注册接口在拿到证书之前必须能匿名访问，
    # 由应用按接口决定是否要求证书。校验结果通过 $ssl_client_verify 透传。
    ssl_client_certificate /etc/nginx/certs/client-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # 上传分块上限 32MB，留出余量
    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://backup_monitor;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 客户端证书校验结果透传。
        # proxy_set_header 会覆盖客户端自带的同名头，因此外部无法伪造；
        # 应用侧还会二次校验「请求是否来自可信代理」。
        proxy_set_header X-Client-Verify      $ssl_client_verify;
        proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;

        # 分块上传与恢复下载都是大流量长连接：关闭缓冲，放宽超时
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # 健康检查不需要经过上面的大流量设置
    location = /health {
        proxy_pass       http://backup_monitor;
        proxy_set_header Host $host;
        access_log       off;
    }
}
