<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>BackupMonitor 管理控制台</title>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f1f5f9; --card:#fff;
  --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --sidebar:#1e293b;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#0891b2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--primary);text-decoration:none}
h2{font-size:18px;margin-bottom:14px}
h3{font-size:15px;margin:14px 0 8px}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text)}
button:hover{background:#f8fafc}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-dark)}
button.danger{color:var(--err);border-color:#fecaca}
button.small{padding:2px 9px;font-size:12.5px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:#f8fafc;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
tr:hover td{background:#fafcff}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;white-space:nowrap}
.b-ok{background:#dcfce7;color:#15803d}.b-warn{background:#fef3c7;color:#b45309}
.b-err{background:#fee2e2;color:#b91c1c}.b-info{background:#cffafe;color:#0e7490}
.b-mut{background:#e2e8f0;color:#475569}.b-pri{background:#dbeafe;color:#1d4ed8}
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--sidebar);color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column}
.sidebar .logo{padding:18px 16px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid #334155}
.sidebar .logo small{display:block;font-weight:400;font-size:11px;color:#94a3b8;margin-top:3px}
.sidebar nav{flex:1;padding:10px 0;overflow-y:auto}
.sidebar nav a{display:block;padding:9px 18px;color:#cbd5e1;font-size:13.5px}
.sidebar nav a:hover{background:#334155;color:#fff}
.sidebar nav a.active{background:var(--primary);color:#fff}
.sidebar .foot{padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #334155}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;justify-content:space-between;align-items:center}
.topbar .who{color:var(--muted);font-size:13px}
.topbar .who b{color:var(--text)}
.content{padding:20px 22px;flex:1;overflow-x:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;margin-top:4px}
.stat .t{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.toolbar select,.toolbar input{width:auto;min-width:130px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 24px}
.kv .row{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed #eef2f7;font-size:13px}
.kv .k{color:var(--muted);min-width:110px;flex-shrink:0}
.kv .v{word-break:break-all}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.modal{background:#fff;border-radius:10px;width:560px;max-width:100%;padding:18px 20px}
.modal.wide{width:820px}
.modal h3{margin:0 0 14px;font-size:16px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.frow{margin-bottom:11px}
.frow label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.frow .hint{font-size:12px;color:#94a3b8;margin-top:3px}
.frow input[type=checkbox]{width:auto;margin-right:6px}
.frow.inline{display:flex;align-items:center}
#toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;color:#fff;font-size:13.5px;max-width:420px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}.toast.info{background:var(--info)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b,#334155)}
.login-box{background:#fff;border-radius:12px;padding:34px 36px;width:380px;max-width:92vw}
.login-box h1{font-size:20px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.login-box .frow label{font-weight:600;color:var(--text)}
.bars{display:flex;gap:5px;align-items:flex-end;height:90px;padding-top:6px}
.bars .bar{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);transform:rotate(0)}
.mono{font-family:Consolas,monospace;font-size:12.5px}
pre.json{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;overflow-x:auto;max-height:300px;white-space:pre-wrap;word-break:break-all}
.empty{padding:30px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;font-size:12.5px}
.chip.bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px}
.chkgrid label{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 4px}
.chkgrid input{width:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const store = {
  get: k => localStorage.getItem('bm_' + k),
  set: (k, v) => localStorage.setItem('bm_' + k, v),
  del: k => localStorage.removeItem('bm_' + k)
};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const L = {
  client_status:{pending_approval:'待审批',online:'在线',suspected_offline:'疑似离线',offline:'离线',disabled:'已禁用',revoked:'已注销',certificate_expired:'证书过期'},
  backup_set_status:{verifying:'校验中',available:'可用',verification_failed:'校验失败',quarantined:'已隔离',retention_pending:'保留待定',recycle_bin:'回收站',deleted:'已删除'},
  restore_status:{requested:'已请求',verifying:'校验中',ready:'就绪',downloading:'下载中',completed:'已完成',failed:'失败',expired:'已过期'},
  alert_level:{critical:'严重',warning:'警告',notice:'提示'},
  alert_status:{open:'未处理',acknowledged:'已确认',in_progress:'处理中',recovered:'已恢复',closed:'已关闭',ignored:'已忽略'},
  notif_status:{pending:'待发送',sent:'已发送',failed:'失败'},
  task_mode:{automatic:'自动',approval_required:'需审批',manual:'手动',monitor_only:'仅监控',paused:'已暂停'},
  importance:{low:'低',normal:'普通',high:'高',critical:'关键'},
  channel:{email:'邮件',wecom:'企业微信',dingtalk:'钉钉'},
  result:{success:'成功',failure:'失败'},
  batch_status:{pending:'等待',running:'执行中',completed:'已完成',partial:'部分完成',failed:'失败',cancelled:'已取消'},
  recognizer:{latest_single_file:'最新单文件',latest_directory:'最新目录',multi_file_set:'多文件集',subdirectory_units:'子目录单元'}
};
const BADGE_CLS = {
  online:'b-ok',available:'b-ok',sent:'b-ok',success:'b-ok',completed:'b-ok',running:'b-ok',recovered:'b-ok',closed:'b-mut',
  pending_approval:'b-warn',verifying:'b-info',ready:'b-pri',downloading:'b-info',pending:'b-warn',acknowledged:'b-info',in_progress:'b-info',
  suspected_offline:'b-warn',warning:'b-warn',notice:'b-mut',partial:'b-warn',approval_required:'b-info',automatic:'b-ok',manual:'b-mut',monitor_only:'b-mut',paused:'b-warn',
  offline:'b-err',disabled:'b-mut',revoked:'b-err',certificate_expired:'b-err',verification_failed:'b-err',quarantined:'b-err',
  recycle_bin:'b-warn',deleted:'b-mut',failed:'b-err',expired:'b-mut',critical:'b-err',open:'b-err',failure:'b-err',cancelled:'b-mut'
};
function badge(group, val){
  const label = (L[group] && L[group][val]) || val || '—';
  return `<span class="badge ${BADGE_CLS[val]||'b-mut'}">${esc(label)}</span>`;
}
function fmtBytes(n){
  if(n==null) return '—';
  n = Number(n);
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(n>=1024 && i<u.length-1){n/=1024;i++;}
  return (i===0?n:n.toFixed(2))+' '+u[i];
}
function fmtDT(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return esc(v);
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function shortId(g){ return g ? String(g).slice(0,8) : '—'; }
function prettyJson(s){
  if(!s) return '—';
  try{ return JSON.stringify(JSON.parse(s), null, 2); }catch(e){ return String(s); }
}

/* ================= API 封装 ================= */
const App = { user:null, timer:null, state:{} };

async function api(path, opts={}){
  const doFetch = async () => {
    const headers = Object.assign({}, opts.headers || {});
    const tok = store.get('accessToken');
    if(tok && !opts.noAuth) headers['Authorization'] = 'Bearer ' + tok;
    let body = opts.body;
    if(body !== undefined && typeof body !== 'string'){
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(body);
    }
    const res = await fetch(path, {method: opts.method || 'GET', headers, body});
    const text = await res.text();
    let json = null;
    try{ json = text ? JSON.parse(text) : null; }catch(e){}
    return {res, json};
  };
  let {res, json} = await doFetch();
  if(res.status === 401 && !opts.noAuth && !opts.retried && store.get('refreshToken')){
    if(await tryRefresh()){ opts.retried = true; return api(path, opts); }
    forceLogin(); return null;
  }
  if(!res.ok || (json && json.success === false)){
    const err = (json && json.error) || {};
    let msg = err.message || ('HTTP ' + res.status);
    if(err.details){
      const d = Object.entries(err.details).map(([k,v]) => `${k}: ${(v||[]).join('；')}`).join('；');
      if(d) msg += '（' + d + '）';
    }
    const e = new Error(msg);
    e.code = err.code; e.status = res.status;
    throw e;
  }
  api.lastMessage = json ? json.message : null;
  return json ? json.data : null;
}

let refreshing = null;
async function tryRefresh(){
  if(!refreshing){
    refreshing = (async () => {
      try{
        const res = await fetch('/api/v1/auth/refresh', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({refreshToken: store.get('refreshToken')})
        });
        const json = await res.json().catch(()=>null);
        if(res.ok && json && json.success && json.data){
          store.set('accessToken', json.data.accessToken);
          store.set('refreshToken', json.data.refreshToken);
          return true;
        }
        return false;
      }catch(e){ return false; }
    })().finally(()=>{ setTimeout(()=>{ refreshing=null; }, 0); });
  }
  return refreshing;
}
function forceLogin(){
  store.del('accessToken'); store.del('refreshToken');
  location.hash = '#/login';
}

/* ================= 提示 / 弹窗 ================= */
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=> el.remove(), 4200);
}
function errToast(e){ toast(e && e.message ? e.message : String(e), 'err'); }

function openModal(title, bodyHtml, opts={}){
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'overlay';
  ov.innerHTML = `<div class="modal ${opts.wide?'wide':''}">
    <h3>${esc(title)}</h3>
    <div class="mbody">${bodyHtml}</div>
    <div class="mfoot">
      <button data-close>关闭</button>
      ${opts.okText ? `<button class="primary" data-ok>${esc(opts.okText)}</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', ev => {
    if(ev.target === ov || ev.target.closest('[data-close]')) closeModal();
  });
  return ov;
}
function closeModal(){ const o = $('#overlay'); if(o) o.remove(); }

function confirmModal(msg){
  return new Promise(resolve => {
    const ov = openModal('请确认', `<p style="line-height:1.7">${esc(msg)}</p>`, {okText:'确定'});
    ov.querySelector('[data-ok]').onclick = () => { closeModal(); resolve(true); };
    ov.addEventListener('click', ev => { if(ev.target === ov || ev.target.closest('[data-close]')) setTimeout(()=>resolve(false),0); });
  });
}

/* 通用表单弹窗：fields=[{name,label,type,value,options,required,placeholder,hint}] */
function formModal(title, fields, onSubmit, okText='保存'){
  const html = fields.map(f => {
    let input;
    const v = f.value != null ? f.value : '';
    if(f.type === 'select'){
      input = `<select name="${f.name}">${(f.options||[]).map(o =>
        `<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
    } else if(f.type === 'textarea'){
      input = `<textarea name="${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
    } else if(f.type === 'checkbox'){
      input = `<label class="frow inline" style="margin:0"><input type="checkbox" name="${f.name}" ${v?'checked':''}>${esc(f.labelText||'启用')}</label>`;
    } else {
      input = `<input type="${f.type||'text'}" name="${f.name}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.type==='number'?'step="any"':''}>`;
    }
    return `<div class="frow"><label>${esc(f.label)}${f.required?' *':''}</label>${input}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  }).join('');
  const ov = openModal(title, html, {okText});
  ov.querySelector('[data-ok]').onclick = async () => {
    const vals = {};
    for(const f of fields){
      const el = ov.querySelector(`[name="${f.name}"]`);
      if(f.type === 'checkbox'){ vals[f.name] = el.checked; }
      else { vals[f.name] = el.value.trim(); }
      if(f.required && (vals[f.name] === '' || vals[f.name] == null)){
        toast(`「${f.label}」为必填项`, 'err'); return;
      }
    }
    const btn = ov.querySelector('[data-ok]');
    btn.disabled = true;
    try{ await onSubmit(vals); closeModal(); }
    catch(e){ errToast(e); btn.disabled = false; }
  };
}

/* ================= 表格 / 分页 ================= */
function tableHtml(cols, rows, emptyText='暂无数据'){
  if(!rows || !rows.length) return `<div class="empty">${esc(emptyText)}</div>`;
  return `<div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr>${cols.map(c=>`<td>${c.render ? c.render(r) : esc(r[c.k] ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function pagerHtml(id, st){
  const pages = Math.max(1, Math.ceil(st.totalCount / st.pageSize));
  return `<div class="pager">
    <span>共 ${st.totalCount} 条 · 第 ${st.page}/${pages} 页</span>
    <button class="small" onclick="App.page('${id}',-1)" ${st.page<=1?'disabled':''}>上一页</button>
    <button class="small" onclick="App.page('${id}',1)" ${st.page>=pages?'disabled':''}>下一页</button>
  </div>`;
}
function optsOf(map){ return Object.entries(map).map(([v,t])=>({v,t})); }

/* ================= 布局 ================= */
const NAV = [
  ['dashboard','仪表盘'],['clients','客户端'],['tasks','备份任务'],['backups','备份集'],
  ['restores','恢复请求'],['alerts','告警'],['deliveries','通知投递'],['audit','审计日志'],
  ['retention','保留策略'],['notif','通知设置'],['operations','批量操作'],['upgrades','Agent 升级']
];
function shell(active, title, body){
  return `<div class="layout">
  <div class="sidebar">
    <div class="logo">BackupMonitor<small>轻量级集中备份采集与监控</small></div>
    <nav>${NAV.map(([k,t])=>`<a href="#/${k}" class="${k===active?'active':''}">${t}</a>`).join('')}</nav>
    <div class="foot">Server API v1</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="font-weight:600">${esc(title)}</div>
      <div class="who">${App.user ? esc(App.user.displayName||App.user.username) : ''}
        &nbsp;<button class="small" onclick="App.logout()">退出登录</button></div>
    </div>
    <div class="content" id="view">${body}</div>
  </div></div>`;
}
function loading(){ return '<div class="empty">加载中…</div>'; }

/* ================= 动作分发 ================= */
App.act = async function(view, action, id){
  try{ await ACTIONS[view + ':' + action](id); }
  catch(e){ errToast(e); }
};
App.page = function(key, delta){
  const st = App.state[key];
  if(!st) return;
  st.page = Math.max(1, st.page + delta);
  LOADERS[key]();
};
App.logout = async function(){
  const rt = store.get('refreshToken');
  try{
    if(rt) await fetch('/api/v1/auth/logout', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+store.get('accessToken')},
      body: JSON.stringify({refreshToken: rt})
    });
  }catch(e){}
  store.del('accessToken'); store.del('refreshToken'); store.del('mustChange');
  location.hash = '#/login'; location.reload();
};

const ACTIONS = {};
const LOADERS = {};

/* ================= 登录页 ================= */
function vLogin(){
  $('#app').innerHTML = `<div class="login-wrap"><div class="login-box">
    <h1>BackupMonitor</h1>
    <div class="sub">轻量级集中备份采集与监控系统 · 管理控制台</div>
    <div class="frow"><label>用户名</label><input id="lg_user" autocomplete="username" value=""></div>
    <div class="frow"><label>密码</label><input id="lg_pass" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%;margin-top:8px" id="lg_btn">登 录</button>
  </div></div>`;
  const doLogin = async () => {
    const btn = $('#lg_btn'); btn.disabled = true;
    try{
      const data = await api('/api/v1/auth/login', {method:'POST', noAuth:true,
        body:{username: $('#lg_user').value.trim(), password: $('#lg_pass').value}});
      store.set('accessToken', data.accessToken);
      store.set('refreshToken', data.refreshToken);
      App.user = data.user;
      if(data.mustChangePassword){
        // OPEN-ISSUES #2：初始口令必须先修改，改密前拦截一切路由
        store.set('mustChange', '1');
        location.hash = '#/change-password';
      } else {
        store.del('mustChange');
        location.hash = '#/dashboard';
      }
    }catch(e){ errToast(e); btn.disabled = false; }
  };
  $('#lg_btn').onclick = doLogin;
  $('#lg_pass').onkeydown = ev => { if(ev.key === 'Enter') doLogin(); };
}

/* ================= 修改口令页（OPEN-ISSUES #2 强制改密） ================= */
function vChangePassword(){
  $('#app').innerHTML = `<div class="login-wrap"><div class="login-box">
    <h1>修改登录口令</h1>
    <div class="sub">为保障账户安全，请立即设置新口令。新口令长度不少于 12 位，且不能与用户名相同。</div>
    <div class="frow"><label>当前口令</label><input id="cp_old" type="password" autocomplete="current-password"></div>
    <div class="frow"><label>新口令</label><input id="cp_new" type="password" autocomplete="new-password"></div>
    <div class="frow"><label>确认新口令</label><input id="cp_new2" type="password" autocomplete="new-password"></div>
    <button class="primary" style="width:100%;margin-top:8px" id="cp_btn">确认修改</button>
  </div></div>`;
  const doChange = async () => {
    const oldPw = $('#cp_old').value, np = $('#cp_new').value, np2 = $('#cp_new2').value;
    if(np !== np2){ toast('两次输入的新口令不一致', 'err'); return; }
    const btn = $('#cp_btn'); btn.disabled = true;
    try{
      await api('/api/v1/auth/change-password', {method:'POST',
        body:{oldPassword: oldPw, newPassword: np}});
      // 成功后服务端已吊销全部刷新令牌，本地清空登录态，用新口令重新登录
      store.del('accessToken'); store.del('refreshToken'); store.del('mustChange');
      toast('口令修改成功，请使用新口令重新登录', 'ok');
      location.hash = '#/login';
      setTimeout(() => location.reload(), 1200);
    }catch(e){ errToast(e); btn.disabled = false; }
  };
  $('#cp_btn').onclick = doChange;
  $('#cp_new2').onkeydown = ev => { if(ev.key === 'Enter') doChange(); };
}

async function taskFormFields(initial){
  const [clients, policies] = await Promise.all([
    api('/api/v1/admin/clients?page=1&pageSize=200'),
    api('/api/v1/admin/retention-policies')
  ]);
  const clientOpts = clients.items.map(c=>({v:c.id, t:`${c.hostname}（${L.client_status[c.status]||c.status}）`}));
  const policyOpts = [{v:'', t:'（不绑定）'}].concat((policies||[]).map(p=>({v:p.id, t:p.name})));
  const v = initial || {};
  const fields = [];
  if(!initial) fields.push({name:'clientId',label:'客户端',type:'select',options:clientOpts,value:v.clientId,required:true});
  fields.push(
    {name:'name',label:'任务名称',type:'text',value:v.name,required:true},
    {name:'applicationName',label:'应用名称',type:'text',value:v.applicationName,required:true,placeholder:'如 SQLServer / Oracle / FileSet'},
    {name:'sourcePath',label:'源路径',type:'text',value:v.sourcePath,required:true,placeholder:'客户端上的备份输出路径'},
    {name:'recognizerType',label:'识别器类型',type:'select',value:v.recognizerType||'latest_directory',required:true,
      options:optsOf(L.recognizer)},
    {name:'taskMode',label:'任务模式',type:'select',value:v.taskMode||'approval_required',options:optsOf(L.task_mode).filter(o=>o.v!=='paused')},
    {name:'importanceLevel',label:'重要级',type:'select',value:v.importanceLevel||'normal',options:optsOf(L.importance)},
    {name:'enabled',label:'状态',labelText:'启用该任务',type:'checkbox',value:v.enabled!==false},
    {name:'priority',label:'优先级',type:'number',value:v.priority??100,hint:'数值小的优先'},
    {name:'scanSchedule',label:'扫描计划（cron，可选）',type:'text',value:v.scanSchedule||'',placeholder:'如 0 2 * * *'},
    {name:'uploadWindowStart',label:'上传窗口开始',type:'text',value:v.uploadWindowStart||'',placeholder:'HH:mm:ss，可选'},
    {name:'uploadWindowEnd',label:'上传窗口结束',type:'text',value:v.uploadWindowEnd||'',placeholder:'HH:mm:ss，可选'},
    {name:'retentionPolicyId',label:'保留策略',type:'select',value:v.retentionPolicyId||'',options:policyOpts},
    {name:'recognizerConfig',label:'识别规则配置（JSON）',type:'textarea',value:v.recognizerConfig||'{}'}
  );
  return fields;
}
function taskFormValues(vals){
  const body = {
    name: vals.name, applicationName: vals.applicationName, sourcePath: vals.sourcePath,
    recognizerType: vals.recognizerType, taskMode: vals.taskMode, enabled: vals.enabled,
    priority: Number(vals.priority)||100, importanceLevel: vals.importanceLevel,
    scanSchedule: vals.scanSchedule||null,
    uploadWindowStart: vals.uploadWindowStart||null, uploadWindowEnd: vals.uploadWindowEnd||null,
    retentionPolicyId: vals.retentionPolicyId||null,

  };
  if(vals.clientId) body.clientId = vals.clientId;
  return body;
}

function retentionFields(v={}){
  return [
    {name:'name',label:'策略名称',type:'text',value:v.name,required:true},
    {name:'keepLastCount',label:'保留最近 N 个版本',type:'number',value:v.keepLastCount??'',hint:'留空表示不限'},
    {name:'keepWeeklyCount',label:'保留周版本数',type:'number',value:v.keepWeeklyCount??''},
    {name:'keepMonthlyCount',label:'保留月末版本数',type:'number',value:v.keepMonthlyCount??''},
    {name:'keepYearlyCount',label:'保留年度版本数',type:'number',value:v.keepYearlyCount??''},
    {name:'minimumRetentionDays',label:'最短保留天数',type:'number',value:v.minimumRetentionDays??30,hint:'小于此天数的版本不回收（服务端最小钳制为 30）'},
    {name:'recycleBinDays',label:'回收区保留天数',type:'number',value:v.recycleBinDays??30}
  ];

function retentionBody(v){
  const num = s => s===''||s==null ? null : Number(s);
  return {
    name: v.name, keepLastCount: num(v.keepLastCount), keepWeeklyCount: num(v.keepWeeklyCount),
    keepMonthlyCount: num(v.keepMonthlyCount), keepYearlyCount: num(v.keepYearlyCount),
    minimumRetentionDays: Number(v.minimumRetentionDays)||0, recycleBinDays: Number(v.recycleBinDays)||0
  };
}

async function route(){
  clearTimeout(App.timer);
  const hash = location.hash || '#/login';
  const parts = hash.replace(/^#\//,'').split('/');
  const page = parts[0], param = parts[1];
  if(!store.get('accessToken')){ vLogin(); return; }
  // OPEN-ISSUES #2：强制改密期间除改密页外一律拦截
  if(store.get('mustChange') === '1'){
    if(page === 'change-password'){ vChangePassword(); return; }
    location.hash = '#/change-password'; return;
  }
  if(page === 'login'){ location.hash = '#/dashboard'; return; }
  if(page === 'change-password'){ vChangePassword(); return; }
  if(page === 'clients' && param){ vClientDetail(param); return; }
  if(page === 'backups' && param){ vBackupDetail(param); return; }
  const fn = ROUTES[page];
  if(fn) await fn(); else vLogin();
}
window.addEventListener('hashchange', route);

(async function init(){
  if(store.get('accessToken')){
    try{ App.user = await api('/api/v1/auth/me'); }catch(e){}
  }
  route();
})();
</script>
